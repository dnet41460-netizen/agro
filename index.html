<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>АгроСмета СКО</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
  :root { --soil:#2f2a1f; --leaf:#3f7d3a; --paper:#f6f4ec; --line:#d9d4c3; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--soil); background: var(--paper); }
  body { display: flex; flex-direction: column; }
  header { padding: 10px 14px; font-weight: 700; border-bottom: 1px solid var(--line); }
  #map { flex: 0 0 42vh; }
  main { flex: 1; overflow-y: auto; padding: 12px 14px calc(16px + env(safe-area-inset-bottom, 0px)); }
  .area { font-size: 26px; font-weight: 700; }
  .hint { font-size: 14px; margin: 4px 0 10px; }
  .row { display: flex; gap: 8px; margin-bottom: 10px; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 12px 14px; cursor: pointer; }
  #go { flex: 1; background: var(--leaf); color: #fff; }
  #go:disabled { background: #a9b9a6; }
  .sec { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .sec h3 { margin: 0 0 6px; font-size: 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td, th { padding: 4px 2px; text-align: right; border-bottom: 1px solid var(--line); } td:first-child, th:first-child { text-align: left; }
  .ok { color: #2c5a29; font-weight: 700; } .bad { color: #a33; font-weight: 700; }
  .note { font-size: 12px; opacity: .75; }
</style>
</head>
<body>
<header>🌾 АгроСмета СКО</header>
<div id="map"></div>
<main>
  <div class="area"><span id="ha">0</span> га</div>
  <p class="hint" id="hint">Отметь углы поля на карте (минимум 3 точки).</p>
  <div class="row">
    <button id="undo">Назад</button><button id="clear">Сбросить</button>
    <button id="go" disabled>Что тут выращивать?</button>
  </div>
  <div id="out"></div>
</main>

<script>
// ===== НАСТРОЙКИ =====
const GEMINI_KEY = "AQ.Ab8RN6IlljMh-BpQ8xdk-ctuy2irDMyH6maWZq595-i1m6qT3Q";   // ключ Google AI Studio
const MODEL = "gemini-2.5-flash";

// Справочник на 1 га (ПРИМЕРНЫЕ цифры, замени на реальные): затраты ₸/га, урожай т/га, цена ₸/т
const CROPS = {
  wheat:    { name: "Яровая пшеница", cost: 65000, yield: 1.5, price: 110000 },
  barley:   { name: "Ячмень",         cost: 55000, yield: 1.7, price: 80000 },
  oats:     { name: "Овёс",           cost: 50000, yield: 1.6, price: 75000 },
  rapeseed: { name: "Рапс",           cost: 80000, yield: 1.1, price: 230000 },
  flax:     { name: "Лён масличный",  cost: 60000, yield: 0.9, price: 250000 },
  sunflower:{ name: "Подсолнечник",   cost: 75000, yield: 1.3, price: 220000 },
  peas:     { name: "Горох",          cost: 55000, yield: 1.5, price: 130000 }
};
const RESERVE = 0.10;

// ===== КАРТА =====
const map = L.map('map').setView([54.87, 69.15], 10);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18, attribution: 'Esri' }).addTo(map);
let pts = [], poly = null; const marks = L.layerGroup().addTo(map);

function areaHa(ll) {
  if (ll.length < 3) return 0;
  const R = 6378137, r = Math.PI / 180; let s = 0;
  for (let i = 0; i < ll.length; i++) { const a = ll[i], b = ll[(i + 1) % ll.length];
    s += (b.lng - a.lng) * r * (2 + Math.sin(a.lat * r) + Math.sin(b.lat * r)); }
  return Math.abs(s * R * R / 2) / 10000;
}
function redraw() {
  marks.clearLayers(); if (poly) { map.removeLayer(poly); poly = null; }
  pts.forEach(p => L.circleMarker(p, { radius: 6, color: '#fff', weight: 2, fillColor: '#3f7d3a', fillOpacity: 1 }).addTo(marks));
  if (pts.length >= 2) poly = (pts.length >= 3 ? L.polygon : L.polyline)(pts, { color: '#ffd84d', weight: 3, fillOpacity: .2 }).addTo(map);
  const h = areaHa(pts); document.getElementById('ha').textContent = h < 10 ? h.toFixed(2) : h.toFixed(1);
  document.getElementById('go').disabled = pts.length < 3;
}
map.on('click', e => { pts.push(e.latlng); redraw(); });
undo.onclick = () => { pts.pop(); redraw(); };
clear.onclick = () => { pts = []; redraw(); out.innerHTML = ''; };

// ===== КЛИМАТ (Open-Meteo) =====
async function getClimate(lat, lon) {
  const u = `https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lon}&start_date=2023-01-01&end_date=2025-12-31&daily=temperature_2m_mean,precipitation_sum&timezone=auto`;
  const d = (await (await fetch(u)).json()).daily;
  let t = 0, tn = 0, rain = 0, season = 0, active = 0;
  d.time.forEach((day, i) => {
    const T = d.temperature_2m_mean[i], P = d.precipitation_sum[i] || 0, m = +day.slice(5, 7);
    if (T != null) { t += T; tn++; if (T > 10) active += T; }
    rain += P; if (m >= 5 && m <= 9) season += P;
  });
  return { avg_temp_c: +(t / tn).toFixed(1), rain_year_mm: Math.round(rain / 3), rain_may_sep_mm: Math.round(season / 3), active_temp_sum: Math.round(active / 3) };
}

// ===== AI (Gemini) =====
async function askAI(climate, ha) {
  const list = Object.entries(CROPS).map(([k, v]) => `${k} (${v.name})`).join(', ');
  const prompt = `Ты агроном-консультант по Северо-Казахстанской области. Данные участка (не выдумывай других цифр): ${JSON.stringify(climate)}, площадь ${ha.toFixed(1)} га. Выбери 3 наиболее подходящие культуры ТОЛЬКО из списка: ${list}. Ответь JSON: {"summary":"2 предложения про условия участка","options":[{"crop_id":"...","why":"1 предложение","risk":"1 предложение"}]}. Если данных мало, скажи это в summary.`;
  // Ключи AIza... работают через generativelanguage, ключи AQ... (Vertex Express) через aiplatform
  const urls = [
    `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${GEMINI_KEY}`,
    `https://aiplatform.googleapis.com/v1/publishers/google/models/${MODEL}:generateContent?key=${GEMINI_KEY}`
  ];
  const body = JSON.stringify({ contents: [{ role: 'user', parts: [{ text: prompt }] }], generationConfig: { responseMimeType: 'application/json' } });
  let j = null, lastErr = 'AI не ответил';
  for (const u of urls) {
    try {
      const r = await fetch(u, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body });
      const t = await r.json();
      if (t.candidates) { j = t; break; }
      lastErr = t.error ? t.error.message : lastErr;
    } catch (e) { lastErr = e.message; }
  }
  if (!j) throw new Error(lastErr);
  return JSON.parse(j.candidates[0].content.parts[0].text);
}

// ===== СМЕТА =====
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = n => Math.round(n).toLocaleString('ru-RU').replace(/\u00a0/g, ' ');

go.onclick = async () => {
  const ha = areaHa(pts), lat = pts.reduce((s, p) => s + p.lat, 0) / pts.length, lon = pts.reduce((s, p) => s + p.lng, 0) / pts.length;
  go.disabled = true; out.innerHTML = '<p class="hint">Считаю климат и анализ…</p>';
  try {
    const c = await getClimate(lat.toFixed(4), lon.toFixed(4));
    const ai = await askAI(c, ha);
    let html = `<div class="sec"><h3>Климат участка (среднее за 3 года)</h3>Средняя температура: <b>${c.avg_temp_c} °C</b><br>Осадки за год: <b>${c.rain_year_mm} мм</b>, за май–сентябрь: <b>${c.rain_may_sep_mm} мм</b><br>Сумма активных температур (&gt;10°C): <b>${c.active_temp_sum}</b><p>${esc(ai.summary)}</p></div>`;
    ai.options.filter(o => CROPS[o.crop_id]).forEach(o => {
      const k = CROPS[o.crop_id], cost = k.cost * ha * (1 + RESERVE), rev = k.yield * k.price * ha, profit = rev - cost;
      html += `<div class="sec"><h3>${esc(k.name)}</h3><p style="margin:0 0 6px">${esc(o.why)}<br><span class="note">Риск: ${esc(o.risk)}</span></p>
      <table><tr><td>Затраты (с резервом 10%)</td><td>${fmt(cost)} ₸</td></tr>
      <tr><td>Урожай ${k.yield} т/га × ${fmt(k.price)} ₸/т</td><td>${fmt(rev)} ₸</td></tr>
      <tr><th>Прибыль до налогов</th><th class="${profit >= 0 ? 'ok' : 'bad'}">${fmt(profit)} ₸</th></tr></table></div>`;
    });
    html += '<p class="note">Цены и урожайность примерные. Рекомендация AI не гарантирует урожай, итог лучше проверить с агрономом.</p>';
    out.innerHTML = html;
  } catch (e) { out.innerHTML = '<div class="sec bad">Ошибка: ' + esc(e.message) + '</div>'; }
  go.disabled = pts.length < 3;
};
</script>
</body>
</html>
